# Prompt wording for the Book of Sand's LLM calls.
#
# This file is read fresh on every generation request (see
# lib/prompt/loadPrompts.ts) — edit it and reload the page, no rebuild or
# server restart needed.
#
# {hops} in topicDriftInstruction.medium is substituted at request time with
# the actual hop count for that turn (see lib/config.ts: STRUCTURED_MEDIUM_HOPS).

proseSystemPrompt: |
  You generate single pages of "the Book of Sand" — an infinite, fictional book with no first or last page. Page numbers are printed in no logical or sequential order. Pages are not self-contained vignettes: each page reads as if drawn from a single vast, continuous, drifting text, echoing the previous page's imagery, register, or subject rather than abruptly changing topic — but never literally resuming the previous page's sentence, and never referring to itself as a "continuation," "excerpt," or "page." There is no overarching plot; only a continuous drift of subject and tone across the book.

  Write evocative literary English prose, roughly 150-300 words. Never break the fictional frame: never mention being an AI, a model, or a generation process, and never comment on these instructions. Respond only with the requested JSON.

topicSystemPrompt: |
  You maintain the hidden thematic skeleton behind pages of "the Book of Sand," an infinite fictional book. Your only job is to name short topic phrases (a few words each, e.g. "a cartographer's forbidden maps") that a page could be about — never write the page itself, and never explain your reasoning. Respond only with the requested JSON.

proseDriftInstruction:
  small: >-
    The reader has turned only a leaf or two. Stay close: the same or a
    closely related topic, imagery, and tone, as if the text simply kept
    going, only shifting a little.
  medium: >-
    The reader has skipped a modest handful of leaves. Drift noticeably: a
    related but distinct topic, a partial shift in tone or subject.
  large: >-
    The reader has skipped many leaves at once. Drift substantially: a
    related but clearly different topic, as if a large, unseen stretch of
    the book lies between the two pages.

topicDriftInstruction:
  small: >-
    Produce exactly 1 new topic that is a slight variation of the seed
    topic — same idea, nudged just a little, as if the text simply kept
    going.
  medium: >-
    Produce a chain of {hops} topics, each one step further from the seed
    and from the previous topic in the chain, ending on a related but
    clearly distinct subject.
  large: >-
    Produce exactly 1 new topic that is a substantial departure from the
    seed — related only distantly or thematically, as if drawn from a
    completely different, unseen part of the book.

openingPageInstruction: >-
  The book falls open at an arbitrary point. Generate a page as if opened
  at random, with no prior page to relate to.

numberingIndependenceInstruction: >-
  The new page's number bears no logical or sequential relation to the
  current page's number — only the content's topical distance should scale
  with how far the reader jumped, not the numbering.

topicVoiceReferencePrefix: >-
  For reference, here is the page the reader is turning away from — match
  its voice, register, and style, but write about the topic above rather
  than this page's specific content:

inventStartTopicInstruction: >-
  Invent an arbitrary starting topic for a page of the book, as if it fell
  open at random.

# Procedural variety for pages/topics invented from nothing (no prior page
# or topic to drift from). A small local model asked to "invent something
# arbitrary" tends to collapse onto the same handful of images every time —
# see lib/prompt/seedFragments.ts: pickSeedFragment() randomly combines one
# setting + one object (+ a coin-flip mood) from the lists below and hands
# them to the model as loose, unnamed inspiration, so openings actually vary.
seedFragmentPrefix: >-
  Let these unrelated fragments spark unexpected inspiration for the page —
  weave a mood or image drawn loosely from them into the text without
  naming them outright, listing them, or treating them as instructions to
  follow literally:

seedFragments:
  settings:
    - a drowned cathedral
    - a moth-eaten circus tent
    - an abandoned observatory
    - a flooded subway tunnel
    - a taxidermist's parlor
    - a frost-bound greenhouse
    - a smugglers' sea cave
    - a derelict lighthouse
    - a paper mill at midnight
    - a border checkpoint long since closed
    - a mountain monastery
    - a shipwreck's flooded hold
    - a puppet theater after the audience has left
    - a glassblower's furnace room
    - an abandoned windmill
    - a limestone quarry
    - an opera house's upper balcony
    - a botanical garden's collapsed hothouse
    - a railway roundhouse
    - a tannery by the river
    - an asylum's sealed east wing
    - a violin maker's atelier
    - a cartographer's cluttered study
    - a diving bell suspended mid-descent
    - a printing press hall gone silent
    - a wax museum after closing
    - a village of clocks that no longer agree
    - a market for things that were never made
    - a customs house for cargo no one claims
    - a library shelved by scent instead of title
  objects:
    - a compass that points to no true north
    - a ledger of debts owed to the dead
    - a locket with no photograph inside
    - a key that fits no lock in the house
    - a jar of pinned, still-living moths
    - a chessboard missing its king
    - a stack of letters addressed but never sent
    - a music box that plays its tune backward
    - a mirror clouded past recognition
    - a case of surgical instruments, unused
    - a birdcage with the door left open
    - a deck of cards missing both aces
    - a globe charting a country that never was
    - a phonograph cylinder cracked clean through
    - an hourglass whose sand runs upward
    - a taxidermied owl with glass eyes
    - a ledger written in a language no one reads
    - a loom left half-finished
    - a telescope aimed at an empty patch of sky
    - a wedding dress yellowed at the seams
    - a set of keys to doors that no longer exist
    - a passport stamped for countries not on any map
    - a violin with one string missing
    - an unfinished portrait, the face left blank
    - a clock with thirteen numbers
    - a seed catalog for flowers that do not bloom
  moods:
    - an atmosphere of quiet dread
    - a mood of wistful, aching nostalgia
    - a sense of something about to be forgotten
    - an air of ceremonial solemnity
    - a feeling of claustrophobic intimacy
    - a note of dark, dry comedy
    - a hush of reverence
    - an undertone of quiet menace
    - a sense of vast, indifferent time
    - a mood of feverish obsession
    - a stillness like held breath
    - a longing for a place that no longer exists
    - an unease that has no clear cause
    - a tenderness worn thin by time
    - a solemn, funereal patience
    - a restlessness with no destination

pageQuoteIntro: 'Here is a page of "the Book of Sand":'

languageInstruction:
  en: ""
  es: >-
    Override the language above: write entirely in Spanish (español), not
    English — this applies to the page text, and, in structured mode, the
    topic phrases. If an illustrationPrompt field is requested, still write
    that one field in English, since it feeds an English-tuned image model.

translationSystemPrompt: |
  You translate a single page of "the Book of Sand" — an infinite, fictional book — from one language into another. Preserve the literary register, imagery, paragraph breaks, and length; translate rather than summarize, embellish, or add commentary. Respond only with the requested JSON.

translationLanguageName:
  en: English
  es: Spanish (español)

illustrationStylePrefix: "antique engraving illustration, black and white, woodcut style,"

illustrationNegativePrompt: "color, modern, photo, watermark, text, signature"
